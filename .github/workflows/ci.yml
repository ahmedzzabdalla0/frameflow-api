name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: frameflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/frameflow_ci?schema=public
      JWT_SECRET: ci-pipeline-secret-value-not-for-production
      JWT_EXPIRES_IN: 1d
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci-pipeline-password
      UPLOADS_DIR: ./storage/uploads
      THUMBS_DIR: ./storage/thumbs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run linter
        run: npm run lint

      - name: Apply database migrations
        run: npm run prisma:migrate:deploy

      - name: Build application
        run: npm run build

      - name: Run unit tests
        run: npm run test -- --ci --coverage

      - name: Run end-to-end tests
        run: npm run test:e2e -- --ci
